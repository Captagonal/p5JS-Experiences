<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P5.JS</title>
    <style>
        body {
            font-family: system-ui;
            background-color: #121212;
            color: #ffffff;
            max-width: 500px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .links a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.875rem 1rem;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #ededed;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .links a:hover {
            border-color: #555555;
            background-color: #222222;
        }

        .links a::after {
            content: ">";
            color: #878787;
            font-size: 0.9rem;
        }

        .links a:hover::after {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <h1>P5.JS</h1>

    <div class="links">
        <a href="2D Interactive/">P5Ball</a>
        <a href="TypeDraw/">TypeDraw</a>
        <a href="3D Space/">3D Space</a>
    </div>
</body>

</html>
